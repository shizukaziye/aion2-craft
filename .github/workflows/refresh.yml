name: refresh-data
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python tools/fetch_data.py
      - name: alerts
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: node tools/alerts.mjs
      - name: commit
        run: |
          git config user.name "aion2-craft bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - name: notify via issue
        if: ${{ hashFiles('data/alerts_new.md') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s data/alerts_new.md ]; then echo "no new alerts"; exit 0; fi
          N=$(gh issue list --state open --search "Market alerts in:title" --json number --jq '.[0].number')
          if [ -z "$N" ]; then
            N=$(gh issue create --title "Market alerts" --body "Rolling thread. Each comment is a batch of new alerts from the hourly bake. Thresholds live in data/alerts_config.json." --json number --jq .number 2>/dev/null || gh issue create --title "Market alerts" --body "Rolling thread." | grep -oE '[0-9]+$')
          fi
          gh issue comment "$N" --body-file data/alerts_new.md
